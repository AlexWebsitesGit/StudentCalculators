<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Matemáticas Aplicadas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
            color: #333;
        }
        header {
            background-color: #0056b3;
            color: white;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
        }
        .container {
            max-width: 1000px;
            margin: 20px auto;
            background: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        /* Calculadora */
        .calculator {
            width: 260px;
            margin: 20px auto;
            text-align: center;
            background: #e9ecef;
            padding: 15px;
            border-radius: 8px;
        }
        .calculator input[type="text"] {
            width: 100%;
            height: 40px;
            font-size: 20px;
            text-align: right;
            margin-bottom: 10px;
            box-sizing: border-box;
            padding-right: 5px;
        }
        .calculator .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
        }
        .calculator button {
            height: 45px;
            font-size: 18px;
            cursor: pointer;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: white;
        }
        .calculator button:hover { background: #ddd; }

        /* Juegos Ocultos */
        #games-section {
            display: none;
            margin-top: 30px;
            border-top: 3px solid #0056b3;
            padding-top: 20px;
        }
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        .game-card {
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            background: #fafafa;
        }
        .game-card h3 {
            margin-top: 0;
            color: #0056b3;
        }
        iframe {
            width: 100%;
            height: 400px;
            border: none;
            border-radius: 6px;
            background: #000;
        }
    </style>
</head>
<body>

<header>
    <h1>Herramientas y Recursos Matemáticos</h1>
</header>

<div class="container">
    <h2>Calculadora interactiva</h2>
    <div class="calculator">
        <input type="text" id="calc-display" readonly>
        <div class="buttons">
            <button onclick="appendCalc('7')">7</button>
            <button onclick="appendCalc('8')">8</button>
            <button onclick="appendCalc('9')">9</button>
            <button onclick="appendCalc('/')">/</button>
            <button onclick="appendCalc('4')">4</button>
            <button onclick="appendCalc('5')">5</button>
            <button onclick="appendCalc('6')">6</button>
            <button onclick="appendCalc('*')">*</button>
            <button onclick="appendCalc('1')">1</button>
            <button onclick="appendCalc('2')">2</button>
            <button onclick="appendCalc('3')">3</button>
            <button onclick="appendCalc('-')">-</button>
            <button onclick="clearCalc()">C</button>
            <button onclick="appendCalc('0')">0</button>
            <button onclick="calculateResult()">=</button>
            <button onclick="appendCalc('+')">+</button>
        </div>
    </div>

    <!-- Sección Oculta con los Juegos de Y8 -->
    <div id="games-section">
        <h2>Sección Interactiva</h2>
        <div class="game-grid">
            
            <!-- Ping Pong 3D WebGL -->
            <div class="game-card">
                <h3>Ping Pong 3D WebGL</h3>
                <iframe src="https://id.y8.com/games/ping_pong_3d_webgl/deploy" allowfullscreen></iframe>
            </div>

            <!-- Moto Flip Race -->
            <div class="game-card">
                <h3>Moto Flip Race</h3>
                <iframe src="https://id.y8.com/games/moto_flip_race/deploy" allowfullscreen></iframe>
            </div>

            <!-- Turn and Hit -->
            <div class="game-card">
                <h3>Turn and Hit</h3>
                <iframe src="https://id.y8.com/games/turn_and_hit/deploy" allowfullscreen></iframe>
            </div>

        </div>
    </div>
</div>

<script>
    const SECRET_CODE = "6767";

    function appendCalc(value) {
        const display = document.getElementById('calc-display');
        display.value += value;
        checkSecretCode(display.value);
    }

    function clearCalc() {
        document.getElementById('calc-display').value = '';
    }

    function calculateResult() {
        const display = document.getElementById('calc-display');
        try { display.value = eval(display.value); } 
        catch (e) { display.value = 'Error'; }
    }

    function checkSecretCode(val) {
        if (val.includes(SECRET_CODE)) {
            document.getElementById('games-section').style.display = 'block';
        }
    }
</script>

</body>
</html>
