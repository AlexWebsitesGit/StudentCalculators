<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Matemáticas Aplicadas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
            color: #333;
        }
        header {
            background-color: #0056b3;
            color: white;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
        }
        .container {
            max-width: 900px;
            margin: 20px auto;
            background: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        /* Calculadora */
        .calculator {
            width: 260px;
            margin: 20px auto;
            text-align: center;
            background: #e9ecef;
            padding: 15px;
            border-radius: 8px;
        }
        .calculator input[type="text"] {
            width: 100%;
            height: 40px;
            font-size: 20px;
            text-align: right;
            margin-bottom: 10px;
            box-sizing: border-box;
            padding-right: 5px;
        }
        .calculator .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
        }
        .calculator button {
            height: 45px;
            font-size: 18px;
            cursor: pointer;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: white;
        }
        .calculator button:hover { background: #ddd; }

        /* Sección de Juegos */
        #games-section {
            display: none;
            margin-top: 30px;
            border-top: 3px solid #0056b3;
            padding-top: 20px;
        }
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }
        .game-card {
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            background: #fafafa;
        }
        canvas {
            background: #111;
            border-radius: 6px;
            width: 100%;
            max-width: 250px;
            height: 200px;
            display: block;
            margin: 10px auto;
            border: 2px solid #333;
        }
        .controls-hint {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
        .play-btn {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            font-weight: bold;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 5px;
        }
        .play-btn:hover { background: #218838; }
    </style>
</head>
<body>

<header>
    <h1>Herramientas y Recursos Matemáticos</h1>
</header>

<div class="container">
    <h2>Calculadora Interactiva</h2>
    <div class="calculator">
        <input type="text" id="calc-display" readonly>
        <div class="buttons">
            <button onclick="appendCalc('7')">7</button>
            <button onclick="appendCalc('8')">8</button>
            <button onclick="appendCalc('9')">9</button>
            <button onclick="appendCalc('/')">/</button>
            <button onclick="appendCalc('4')">4</button>
            <button onclick="appendCalc('5')">5</button>
            <button onclick="appendCalc('6')">6</button>
            <button onclick="appendCalc('*')">*</button>
            <button onclick="appendCalc('1')">1</button>
            <button onclick="appendCalc('2')">2</button>
            <button onclick="appendCalc('3')">3</button>
            <button onclick="appendCalc('-')">-</button>
            <button onclick="clearCalc()">C</button>
            <button onclick="appendCalc('0')">0</button>
            <button onclick="calculateResult()">=</button>
            <button onclick="appendCalc('+')">+</button>
        </div>
    </div>

    <!-- Sección de Juegos Integrados -->
    <div id="games-section">
        <h2>Sección Interactiva</h2>
        <div class="game-grid">
            
            <!-- Juego 1: Drive Mad Replica -->
            <div class="game-card">
                <h3>Drive Mad (Físicas 2D)</h3>
                <canvas id="canvas-drivemad" width="250" height="200"></canvas>
                <button class="play-btn" onclick="startDriveMad()">▶ ¡JUGAR / REINICIAR!</button>
                <p class="controls-hint">Controles: Flechas Izquierda / Derecha</p>
            </div>

            <!-- Juego 2: Traffic Racer -->
            <div class="game-card">
                <h3>Traffic Racer</h3>
                <canvas id="canvas-traffic" width="250" height="200"></canvas>
                <button class="play-btn" onclick="startTraffic()">▶ ¡JUGAR / REINICIAR!</button>
                <p class="controls-hint">Controles: Flechas Izquierda / Derecha</p>
            </div>

            <!-- Juego 3: Drift Master -->
            <div class="game-card">
                <h3>Drift Master</h3>
                <canvas id="canvas-drift" width="250" height="200"></canvas>
                <button class="play-btn" onclick="startDrift()">▶ ¡JUGAR / REINICIAR!</button>
                <p class="controls-hint">Controles: Tecla Espacio o Clic en la pantalla</p>
            </div>

        </div>
    </div>
</div>

<script>
    const SECRET_CODE = "6767";

    function appendCalc(value) {
        const display = document.getElementById('calc-display');
        display.value += value;
        checkSecretCode(display.value);
    }

    function clearCalc() {
        document.getElementById('calc-display').value = '';
    }

    function calculateResult() {
        const display = document.getElementById('calc-display');
        try { display.value = eval(display.value); } 
        catch (e) { display.value = 'Error'; }
    }

    function checkSecretCode(val) {
        if (val.includes(SECRET_CODE)) {
            document.getElementById('games-section').style.display = 'block';
            startDriveMad();
            startTraffic();
            startDrift();
        }
    }

    // Controles por teclado
    const keys = {};
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    // --- JUEGO 1: DRIVE MAD ---
    let dmState = {}, dmLoopRunning = false;
    function startDriveMad() {
        dmState = { x: 30, y: 150, vx: 0 };
        if (!dmLoopRunning) {
            dmLoopRunning = true;
            updateDriveMad();
        }
    }
    function updateDriveMad() {
        const canvas = document.getElementById('canvas-drivemad');
        const ctx = canvas.getContext('2d');
        
        if (keys['ArrowRight']) dmState.vx += 0.2;
        if (keys['ArrowLeft']) dmState.vx -= 0.1;
        dmState.vx *= 0.95;
        dmState.x += dmState.vx;

        let terrainY = 160 - Math.sin(dmState.x * 0.05) * 20;
        dmState.y = terrainY - 10;

        ctx.fillStyle = "#222";
        ctx.fillRect(0, 0, 250, 200);

        ctx.fillStyle = "#8B5A2B";
        ctx.beginPath();
        ctx.moveTo(0, 200);
        for(let i = 0; i <= 250; i += 10) {
            let worldX = dmState.x - 30 + i;
            let ty = 160 - Math.sin(worldX * 0.05) * 20;
            ctx.lineTo(i, ty);
        }
        ctx.lineTo(250, 200);
        ctx.fill();

        ctx.fillStyle = "#e74c3c";
        ctx.fillRect(30, dmState.y - 10, 20, 10);
        ctx.fillStyle = "#000";
        ctx.beginPath();
        ctx.arc(33, dmState.y, 4, 0, Math.PI*2);
        ctx.arc(47, dmState.y, 4, 0, Math.PI*2);
        ctx.fill();

        requestAnimationFrame(updateDriveMad);
    }

    // --- JUEGO 2: TRAFFIC RACER ---
    let trState = {}, trLoopRunning = false;
    function startTraffic() {
        trState = { playerX: 110, obsY: -50, obsX: 110, score: 0 };
        if (!trLoopRunning) {
            trLoopRunning = true;
            updateTraffic();
        }
    }
    function updateTraffic() {
        const canvas = document.getElementById('canvas-traffic');
        const ctx = canvas.getContext('2d');

        if (keys['ArrowLeft'] && trState.playerX > 60) trState.playerX -= 3;
        if (keys['ArrowRight'] && trState.playerX < 160) trState.playerX += 3;

        trState.obsY += 3;
        if (trState.obsY > 200) {
            trState.obsY = -40;
            trState.obsX = 60 + Math.random() * 100;
            trState.score++;
        }

        ctx.fillStyle = "#333";
        ctx.fillRect(0, 0, 250, 200);
        
        ctx.fillStyle = "#fff";
        ctx.fillRect(50, 0, 5, 200);
        ctx.fillRect(195, 0, 5, 200);

        ctx.fillStyle = "#3498db";
        ctx.fillRect(trState.playerX, 150, 20, 35);

        ctx.fillStyle = "#e74c3c";
        ctx.fillRect(trState.obsX, trState.obsY, 20, 35);

        ctx.fillStyle = "#fff";
        ctx.font = "14px Arial";
        ctx.fillText("Puntos: " + trState.score, 10, 20);

        requestAnimationFrame(updateTraffic);
    }

    // --- JUEGO 3: DRIFT MASTER ---
    let dfState = {}, dfLoopRunning = false;
    function startDrift() {
        dfState = { x: 125, y: 150, dir: 1, score: 0, alive: true };
        if (!dfLoopRunning) {
            dfLoopRunning = true;
            updateDrift();
        }
    }
    
    function toggleDriftDir() {
        if (dfState.alive) dfState.dir *= -1;
    }

    window.addEventListener('keydown', e => {
        if(e.code === 'Space') toggleDriftDir();
    });

    function updateDrift() {
        const canvas = document.getElementById('canvas-drift');
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = "#2c3e50";
        ctx.fillRect(0, 0, 250, 200);

        // Pista
        ctx.fillStyle = "#7f8c8d";
        ctx.fillRect(30, 0, 190, 200);

        if (dfState.alive) {
            dfState.x += dfState.dir * 1.5;
            dfState.y -= 0.2;
            dfState.score++;

            if (dfState.y < 0) dfState.y = 180;
            if (dfState.x < 30 || dfState.x > 210) dfState.alive = false;
        }

        ctx.fillStyle = "#f1c40f";
        ctx.fillRect(dfState.x, dfState.y, 12, 12);

        ctx.fillStyle = "#fff";
        ctx.font = "14px Arial";
        ctx.fillText(dfState.alive ? "Puntos: " + dfState.score : "¡Chocaste! Presiona botón", 10, 20);

        requestAnimationFrame(updateDrift);
    }
</script>

</body>
</html>
